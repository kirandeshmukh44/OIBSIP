<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="converter">
        <p class="tag">TEMPERATURE TOOL</p>
        <h1>Temperature Converter</h1>
        <p>Convert temperatures between Celsius, Fahrenheit and Kelvin.</p>

        <label for="temperature">Temperature</label>
        <input type="number" id="temperature" placeholder="Enter temperature">

        <label for="unit">Input Unit</label>
        <select id="unit">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>

        <button onclick="convert()">Convert</button>

        <p id="error"></p>

        <div id="result">
            <div>Celsius: <span id="celsius">--</span> °C</div>
            <div>Fahrenheit: <span id="fahrenheit">--</span> °F</div>
            <div>Kelvin: <span id="kelvin">--</span> K</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
